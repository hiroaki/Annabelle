name: CI

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: annabelle-ci:latest
      CONTAINER_NAME: annabelle-ci
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate Active Record encryption keys
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Build runtime-test image
        run: |
          docker build \
            --target runtime-test \
            --build-arg RAILS_ENV=test \
            --build-arg BUNDLE_WITHOUT=development \
            --build-arg PRECOMPILE_ASSETS=1 \
            --tag "$IMAGE_NAME" \
            .

      - name: Run test suite inside container
        run: |
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker run --name "$CONTAINER_NAME" \
            -e DOCKER=1 \
            -e RAILS_ENV=test \
            -e ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY \
            -e ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY \
            -e ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT \
            "$IMAGE_NAME" \
            bash -lc '
              bundle exec rspec &&
              RSPEC_DISABLE_OAUTH_GITHUB=1 bin/rspec spec/system/oauth_github_disabled/
            '

      - name: Collect coverage reports
        if: always()
        run: |
          rm -rf coverage
          docker cp "$CONTAINER_NAME":/rails/coverage ./coverage >/dev/null 2>&1 || true

      - name: Remove CI container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Check Coveralls availability
        id: coveralls_check
        run: |
          if curl -sSf https://coveralls.io > /dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Coveralls GitHub Action
        if: steps.coveralls_check.outputs.available == 'true'
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info
