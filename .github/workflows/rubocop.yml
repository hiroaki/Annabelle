name: RuboCop

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  rubocop:
    name: Run RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Ruby version
        run: echo "RUBY_VERSION=$(cat .ruby-version)" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          # Prefer the binstub if present, otherwise use bundle exec
          if [ -x bin/rubocop ]; then
            bin/rubocop
          else
            bundle exec rubocop
          fi
        # Fail the job on any offenses (default RuboCop behaviour)
