name: RuboCop

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  rubocop:
    name: Run RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read Ruby version
        run: echo "RUBY_VERSION=$(cat .ruby-version)" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          # Prefer the binstub if present, otherwise use bundle exec
          if [ -x bin/rubocop ]; then
            bin/rubocop
          else
            bundle exec rubocop
          fi
        # Fail the job on any offenses (default RuboCop behaviour)
